<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vengeful Realms | Civil War Map</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<img src="Vengefullogo.png" class="logo">

<h1>Vengeful Realms</h1>

<p>Interactive Skyrim Civil War Map</p>

</header>

<nav class="navbar">

<a href="#">Home</a>

<a href="#">Legend</a>

<a href="#">Campaign</a>

<a href="#">Timeline</a>

</nav>

<main>

<div class="mapContainer">

<div class="mapArea">

<img src="SkyrimMap.png" id="map">

<!-- HAAFINGAR -->
<div class="hold"
id="haafingar"
onclick="selectHold('Haafingar')"></div>

<!-- HJAALMARCH -->
<div class="hold"
id="hjaalmarch"
onclick="selectHold('Hjaalmarch')"></div>

<!-- THE REACH -->
<div class="hold"
id="reach"
onclick="selectHold('The Reach')"></div>

<!-- WHITERUN -->
<div class="hold"
id="whiterun"
onclick="selectHold('Whiterun')"></div>

<!-- FALKREATH -->
<div class="hold"
id="falkreath"
onclick="selectHold('Falkreath')"></div>

<!-- THE PALE -->
<div class="hold"
id="pale"
onclick="selectHold('The Pale')"></div>

<!-- WINTERHOLD -->
<div class="hold"
id="winterhold"
onclick="selectHold('Winterhold')"></div>

<!-- EASTMARCH -->
<div class="hold"
id="eastmarch"
onclick="selectHold('Eastmarch')"></div>

<!-- THE RIFT -->
<div class="hold"
id="rift"
onclick="selectHold('The Rift')"></div>

</div>

<aside class="infoPanel">

<h2 id="holdName">
Select a Hold
</h2>

<hr>

<div class="infoBox">

<h3>Current Owner</h3>

<p id="owner">
-
</p>

</div>

<div class="infoBox">

<h3>Jarl</h3>

<p id="jarl">
-
</p>

</div>

<div class="infoBox">

<h3>Status</h3>

<p id="status">
-
</p>

</div>

<div class="infoBox">

<h3>Military Strength</h3>

<p id="strength">
-
</p>

</div>

<div class="infoBox">

<h3>Description</h3>

<p id="description">
Select one of the nine holds to display information.
</p>

</div>

</aside>

</div>

<section class="legend">

<h2>Legend</h2>

<div class="legendGrid">

<div class="legendItem">

<div class="colour empire"></div>

Empire

</div>

<div class="legendItem">

<div class="colour stormcloak"></div>

Stormcloaks

</div>

<div class="legendItem">

<div class="colour contested"></div>

Contested

</div>

<div class="legendItem">

<div class="colour neutral"></div>

Neutral

</div>

</div>

</section>

</main>

<footer>

Vengeful Realms Civil War Map

</footer>

<script src="script.js"></script>

</body>

</html>
